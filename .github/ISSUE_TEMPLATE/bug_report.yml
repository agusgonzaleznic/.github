name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: checkboxes
    id: not-security
    attributes:
      label: Security
      options:
        - label: This is not a security vulnerability. I'll report those privately through the security policy.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release version or a commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime or tool versions (Python, Terraform, runner image, browser), and anything else that matters.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove secrets before you paste it.
      render: shell
